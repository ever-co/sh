# Dependency policy, checked by `cargo deny check` in CI (advisories, bans, licences, sources).
#
# Every third-party crate must carry a licence on the allow-list below; anything else stops the
# build until it has been reviewed. Only crates.io is a permitted source: no git dependencies.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.9
# This repository's own crates are `publish = false`; the policy applies to third-party crates.
private = { ignore = true }

# An exception names one crate, so a licence is never granted to every future dependency.
[[licenses.exceptions]]
name = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { name = "openssl", reason = "rustls only: one TLS stack, no system OpenSSL" },
    { name = "openssl-sys", reason = "rustls only: one TLS stack, no system OpenSSL" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
