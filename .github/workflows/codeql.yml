name: CodeQL

# Code scanning of the Rust API service and the TypeScript site, on GitHub-hosted runners.
#
# The repository uses GitHub's default code scanning setup (Settings > Code security), which scans
# Rust, TypeScript and the workflows themselves every week. While default setup is on, GitHub
# refuses results uploaded by a workflow like this one, so the weekly schedule here is skipped and
# the job runs only when started by hand (after switching default setup off). Code scanning of a
# private repository needs a licence, so a private copy skips every run.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    if: ${{ !github.event.repository.private && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
