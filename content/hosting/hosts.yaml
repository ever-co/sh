    install_source: partner:repocloud
    snippet_kind: none
    referral: null
    order: 140
    status: available

  - id: elestio
    kind: third_party
    title: Elestio
    summary_md: Fully managed open-source hosting on the cloud of your choice, or on your own VM.
    products:
      - { id: traduora, status: available, link: "https://elest.io/open-source/traduora" }
