    summary_md: Run the prebuilt Docker image on Koyeb.
    products:
      - { id: teams, status: available, link: "https://app.koyeb.com/deploy?name=ever-teams&type=docker&builder=dockerfile&image=ghcr.io/ever-co/ever-teams-webapp:latest&env[PORT]=3030&ports=3030;http;/" }
